name: CI

# One run per push: pull requests run on pull_request; main and v* tags run on push.
#
#   pull request          Linux x64: the app and its self-test
#   push to main, manual  the release files, in parallel: Windows x64 (installer and
#                         zip), macOS (dmg, Apple Silicon and Intel), Linux x64 and
#                         arm64 (.deb and AppImage), each with its self-test, plus the
#                         Linux packages installed and tested on Debian 12 and
#                         Ubuntu 22.04 and 24.04. Uploaded as workflow artifacts
#   v* tag                no rebuild: the files from the successful main build of
#                         the tag's commit are attached to the GitHub Release
#
# Docs-only changes skip the builds (see the changes job).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on main are
# never cancelled: every main commit keeps its build, so it can be released.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Debian 12 packages JUCE and Tracktion Engine need on Linux (no curl, web
  # browser or OpenGL: the app leaves those out), a virtual display for the
  # self-test, ccache, and the packaging tools
  LINUX_DEPS: >-
    build-essential g++ cmake ninja-build pkg-config ccache curl file
    libasound2-dev libjack-jackd2-dev ladspa-sdk
    libfreetype-dev libfontconfig1-dev
    libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev
    xvfb xauth
    dpkg-dev librsvg2-bin
  SCCACHE_VERSION: v0.10.0
  SCCACHE_SHA256: 6d8823b5c13e0dba776d88c537229256ecb2f01a1d775b507fd141cb55d30578

jobs:
  # Decides what runs. A pull request or push that only touches docs (*.md,
  # LICENSE, .github/CODEOWNERS) skips the builds; skipped jobs count as passing,
  # so docs-only pull requests stay mergeable when checks are required. Tags and
  # manual runs always run what they need.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      kind: ${{ steps.diff.outputs.kind }}
      linux: ${{ steps.diff.outputs.linux }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # kind: pr (Linux x64 and the self-test), build (all the release files), release (no build)
          if [[ "$REF" == refs/tags/v* ]]; then
            kind=release
          elif [[ "$EVENT" == "pull_request" ]]; then
            kind=pr
          else
            kind=build
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [[ "$kind" == pr ]]; then
            echo 'linux=[{"arch":"x64","runner":"ubuntu-24.04"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'linux=[{"arch":"x64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$EVENT" == "pull_request" ]]; then
            files=$(git diff --name-only "$PR_BASE" "$PR_HEAD")
          elif [[ "$EVENT" == "push" && "$REF" == refs/heads/* && -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            files=$(git diff --name-only "$PUSH_BEFORE" "$SHA")
          else
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "Tag or manual run: everything it needs runs"; exit 0
          fi
          echo "Changed files:"; echo "$files"
          code=$(echo "$files" | grep -Ev '(\.md$|^LICENSE$|^\.github/CODEOWNERS$)' | grep -c . || true)
          if [[ "$code" -gt 0 ]]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs only: builds and tests are skipped"; fi
      - id: version
        name: Version (from CMakeLists.txt; a tag must match it)
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(EncoreStudio VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)
          [[ -n "$version" ]] || { echo "::error::No project(EncoreStudio VERSION x.y.z) in CMakeLists.txt"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
          if [[ "$REF" == refs/tags/v* && "v$version" != "$REF_NAME" ]]; then
            echo "::error::Tag $REF_NAME does not match the version in CMakeLists.txt ($version). Change project(EncoreStudio VERSION ...) on main first."
            exit 1
          fi

  # Built inside Debian 12 (bookworm, glibc 2.36) so the packages also run on
  # Bookworm-based Raspberry Pi OS and other older systems. arm64 runs on GitHub's
  # native arm64 runner, never under emulation.
  linux:
    name: Linux ${{ matrix.arch }} (app and tests${{ needs.changes.outputs.kind == 'build' && ', .deb and AppImage' || '' }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.kind != 'release'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.linux) }}
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 2G
    steps:
      # git first, so checkout makes a real clone (the Tracktion patch is applied with git)
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates $LINUX_DEPS
          git config --global --add safe.directory '*'
      # Submodules: depth 1 and not recursive (submodules: true, not 'recursive').
      # Tracktion Engine, encore-vst and encore-audio-processing have their own
      # submodules, which are not used here.
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      - name: Cache key
        id: key
        run: |
          echo "pins=$(git rev-parse HEAD:external/JUCE | cut -c1-12)-$(git rev-parse HEAD:external/tracktion_engine | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "compiler=gcc-$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
      # Keyed on OS and architecture, compiler and the JUCE and Tracktion pins; each
      # run saves a new one and the next run starts from the newest
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-debian12-${{ matrix.arch }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
          restore-keys: ccache-debian12-${{ matrix.arch }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          ccache -z
          cmake --build build --parallel "$(nproc)"
          ccache -s
      - uses: actions/cache/save@v4
        if: always() && steps.key.outputs.pins != ''
        with:
          path: .ccache
          key: ccache-debian12-${{ matrix.arch }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
      # Makes songs, imports, mixes, exports, reopens and runs each built-in
      # ENCORE. plugin, without an audio device (needs an X display)
      - name: Self-test
        run: |
          exe="build/EncoreStudio_artefacts/Release/Encore Studio"
          dir="$RUNNER_TEMP/selftest"
          code=0
          timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" "$exe" --selftest "$dir" || code=$?
          cat "$dir/selftest.log" || true
          if [ $code -eq 124 ]; then echo "::error::the self-test timed out"; fi
          if [ $code -ne 0 ]; then echo "::error::the self-test failed ($code)"; fi
          exit $code
      # Monitoring, meters and recording against a pretend four-input interface
      # (about a minute, so not on pull requests)
      - name: Audio test
        if: needs.changes.outputs.kind == 'build'
        run: |
          exe="build/EncoreStudio_artefacts/Release/Encore Studio"
          dir="$RUNNER_TEMP/audiotest"
          code=0
          timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" "$exe" --audiotest "$dir" || code=$?
          cat "$dir/audiotest.log" || true
          if [ $code -eq 124 ]; then echo "::error::the audio test timed out"; fi
          if [ $code -ne 0 ]; then echo "::error::the audio test failed ($code)"; fi
          exit $code
      # The .deb (Debian, Ubuntu, Mint, Raspberry Pi OS) and the AppImage (most other distributions)
      - name: Linux packages
        if: needs.changes.outputs.kind == 'build'
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          bash installer/linux/package.sh "build/EncoreStudio_artefacts/Release/Encore Studio" dist all
          cd dist
          for f in *.deb *.AppImage; do sha256sum "$f" > "$f.sha256"; done
          ls -l
          cat *.sha256
      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.kind == 'build'
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error

  # The packages on the oldest and newest systems they're for: a bare Debian 12
  # (Bookworm, the base of Raspberry Pi OS Bookworm), Ubuntu 22.04 and Ubuntu 24.04.
  # Each installs the .deb the way a user would, checks what it put in place, then
  # self-tests the installed app and the AppImage. No build here.
  linux-packages:
    name: Linux packages ${{ matrix.arch }} on ${{ matrix.system }}
    needs: [changes, linux]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.kind == 'build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, system: debian-12, runner: ubuntu-24.04, image: "debian:bookworm" }
          - { arch: x64, system: ubuntu-22.04, runner: ubuntu-22.04, image: "" }
          - { arch: x64, system: ubuntu-24.04, runner: ubuntu-24.04, image: "" }
          - { arch: arm64, system: debian-12, runner: ubuntu-24.04-arm, image: "debian:bookworm" }
          - { arch: arm64, system: ubuntu-22.04, runner: ubuntu-22.04-arm, image: "" }
          - { arch: arm64, system: ubuntu-24.04, runner: ubuntu-24.04-arm, image: "" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
      - name: Check the SHA-256 files
        run: for s in *.sha256; do sha256sum -c "$s"; done
      - name: Test the .deb
        run: |
          SUDO=sudo; [ "$(id -u)" = 0 ] && SUDO=
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends xvfb xauth desktop-file-utils shared-mime-info
          deb=$(ls *.deb)
          $SUDO apt-get install -y --no-install-recommends "./$deb" \
            || { echo "::error::apt could not install $deb"; exit 1; }
          dpkg -L encore-basement-studio
          command -v encore-basement-studio || { echo "::error::encore-basement-studio is not on the PATH"; exit 1; }
          desktop-file-validate /usr/share/applications/encore-basement-studio.desktop || { echo "::error::the .desktop entry does not validate"; exit 1; }
          grep -q "x-encore-song" /usr/share/mime/globs2 || { echo "::error::application/x-encore-song is not registered"; exit 1; }
          grep -q "x-encore-song" /usr/share/applications/mimeinfo.cache || { echo "::error::.encore songs are not linked to the app"; exit 1; }
          dir="$RUNNER_TEMP/selftest-deb"
          code=0
          timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" encore-basement-studio --selftest "$dir" || code=$?
          cat "$dir/selftest.log" || true
          if [ $code -eq 124 ]; then echo "::error::the installed app's self-test timed out"; fi
          if [ $code -ne 0 ]; then echo "::error::the installed app's self-test failed ($code)"; fi
          exit $code
      # Runners have no FUSE, so the AppImage unpacks itself to run (its system libraries came with the .deb above)
      - name: Test the AppImage
        run: |
          img=$(ls *.AppImage)
          chmod +x "$img"
          dir="$RUNNER_TEMP/selftest-appimage"
          code=0
          timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" "./$img" --appimage-extract-and-run --selftest "$dir" || code=$?
          cat "$dir/selftest.log" || true
          if [ $code -eq 124 ]; then echo "::error::the AppImage self-test timed out"; fi
          if [ $code -ne 0 ]; then echo "::error::the AppImage self-test failed ($code)"; fi
          exit $code

  windows:
    name: Windows x64 (app, self-test, installer and zip)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.kind == 'build'
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      - name: Install sccache ${{ env.SCCACHE_VERSION }}
        shell: pwsh
        run: |
          $name = "sccache-$env:SCCACHE_VERSION-x86_64-pc-windows-msvc"
          Invoke-WebRequest "https://github.com/mozilla/sccache/releases/download/$env:SCCACHE_VERSION/$name.zip" -OutFile "$env:RUNNER_TEMP\sccache.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\sccache.zip" -Algorithm SHA256).Hash -ne $env:SCCACHE_SHA256) { throw "sccache download does not match its SHA-256" }
          Expand-Archive "$env:RUNNER_TEMP\sccache.zip" -DestinationPath "$env:RUNNER_TEMP"
          "$env:RUNNER_TEMP\$name" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: MSVC environment, x64 (for Ninja)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache key
        id: key
        shell: bash
        run: |
          echo "pins=$(git rev-parse HEAD:external/JUCE | cut -c1-12)-$(git rev-parse HEAD:external/tracktion_engine | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "compiler=msvc-$VCToolsVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .sccache
          key: sccache-${{ runner.os }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
          restore-keys: sccache-${{ runner.os }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-
      # Embedded debug info (/Z7) so sccache can cache every object
      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      - name: Build
        shell: pwsh
        run: |
          sccache --zero-stats
          cmake --build build --parallel
      # The 32-bit plugin bridge: its own 32-bit build, beside Encore Studio.exe
      - name: MSVC environment, x86 (for the 32-bit bridge)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Build the 32-bit plugin bridge
        shell: pwsh
        run: |
          cmake -B build32 -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTUDIO_BRIDGE_ONLY=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          cmake --build build32 --parallel
          Copy-Item "build32/EncoreStudioBridge32_artefacts/Release/Encore Studio Bridge32.exe" "build/EncoreStudio_artefacts/Release/"
          sccache --show-stats
      - uses: actions/cache/save@v4
        if: always() && steps.key.outputs.pins != ''
        with:
          path: .sccache
          key: sccache-${{ runner.os }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
      - name: Self-test
        shell: pwsh
        run: |
          $exe = "build/EncoreStudio_artefacts/Release/Encore Studio.exe"
          $dir = Join-Path $env:RUNNER_TEMP "selftest"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "`"$dir`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "self-test timed out" }
          Get-Content (Join-Path $dir "selftest.log")
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      # ENCORE. VST's installer, offered in Basement Studio's installer as an extra:
      # the newest published release of Encore-Music-Inc/encore-vst that has one
      # (left out, with a warning, if there is none)
      - name: Fetch the ENCORE. VST installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try {
            $tag = gh api repos/Encore-Music-Inc/encore-vst/releases --jq '[.[] | select(.draft | not) | select(any(.assets[]; .name | endswith("windows-setup.exe")))][0].tag_name'
            if (-not $tag) { throw "no published ENCORE. VST release with a Windows installer" }
            gh release download $tag --repo Encore-Music-Inc/encore-vst --pattern "*windows-setup.exe" --dir build/vst
            Get-ChildItem build/vst/*.exe | Select-Object -First 1 | Rename-Item -NewName "ENCORE-VST-setup.exe"
            "::notice title=ENCORE. VST in the installer::$tag"
          } catch { "::warning title=ENCORE. VST left out of the installer::$_" }
      # Inno Setup: Start menu and desktop shortcuts, opens .encore songs, uninstaller.
      # The version comes from build/version.iss (written by CMake from CMakeLists.txt).
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q installer/EncoreStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "installer failed" }
      - name: Zip and SHA-256
        shell: bash
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          setup="ENCORE-Basement-Studio-$VERSION-windows-setup.exe"
          zip="ENCORE-Basement-Studio-$VERSION-windows-x64.zip"
          test -f "dist/$setup" || { echo "::error::dist/$setup is missing (does the installer's version match CMakeLists.txt?)"; ls dist; exit 1; }
          mkdir zip
          cp "build/EncoreStudio_artefacts/Release/Encore Studio.exe" "build/EncoreStudio_artefacts/Release/Encore Studio Bridge32.exe" zip/
          cp LICENSE THIRD-PARTY-NOTICES.md TRADEMARKS.md README.md zip/
          (cd zip && 7z a -tzip "../dist/$zip" . > /dev/null)
          cd dist
          sha256sum "$setup" > "$setup.sha256"
          sha256sum "$zip" > "$zip.sha256"
          ls -l
          cat *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/ENCORE-Basement-Studio-*-windows-setup.exe
            dist/ENCORE-Basement-Studio-*-windows-setup.exe.sha256
            dist/ENCORE-Basement-Studio-*-windows-x64.zip
            dist/ENCORE-Basement-Studio-*-windows-x64.zip.sha256
          if-no-files-found: error

  macos:
    name: macOS (app, self-test and dmg)
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.kind == 'build'
    runs-on: macos-15
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      - name: Install Ninja and ccache
        run: brew install ninja ccache
      - name: Cache key
        id: key
        run: |
          echo "pins=$(git rev-parse HEAD:external/JUCE | cut -c1-12)-$(git rev-parse HEAD:external/tracktion_engine | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "compiler=xcode-$(xcodebuild -version | head -n 1 | tr -cd '0-9.')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-
      # One app for Apple Silicon and Intel Macs
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          ccache -z
          cmake --build build --parallel "$(sysctl -n hw.ncpu)"
          ccache -s
      - uses: actions/cache/save@v4
        if: always() && steps.key.outputs.pins != ''
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
      - name: Self-test
        run: |
          app="build/EncoreStudio_artefacts/Release/Encore Studio.app"
          lipo -info "$app/Contents/MacOS/Encore Studio"
          dir="$RUNNER_TEMP/selftest"
          "$app/Contents/MacOS/Encore Studio" --selftest "$dir" &
          pid=$!
          for i in $(seq 1 300); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; echo "::error::the self-test timed out"; exit 1; fi
          code=0; wait $pid || code=$?
          cat "$dir/selftest.log"
          exit $code
      # The Mac installer: a disk image to drag the app into Applications
      - name: Disk image and SHA-256
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          dmg="ENCORE-Basement-Studio-$VERSION-macos.dmg"
          mkdir -p dmg dist
          cp -R "build/EncoreStudio_artefacts/Release/Encore Studio.app" dmg/
          ln -s /Applications dmg/Applications
          cp LICENSE dmg/LICENSE.txt
          cp THIRD-PARTY-NOTICES.md TRADEMARKS.md dmg/
          hdiutil create -volname "ENCORE. Basement Studio" -srcfolder dmg -ov -format UDZO "dist/$dmg"
          cd dist
          shasum -a 256 "$dmg" > "$dmg.sha256"
          ls -l
          cat *.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/ENCORE-Basement-Studio-*-macos.dmg
            dist/ENCORE-Basement-Studio-*-macos.dmg.sha256
          if-no-files-found: error

  # The one check to require on main. It fails if any build or test job failed or
  # was cancelled, and passes when they passed or were skipped (docs-only changes).
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, linux, linux-packages, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Check the build and test jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" == failure || "$r" == cancelled ]]; then echo "::error::A build or test job did not pass"; exit 1; fi
          done

  # A person publishes a Release in GitHub, which creates the v* tag. Nothing is
  # rebuilt: the files come from the successful main build of the same commit.
  release:
    name: Release (files from the main build)
    needs: changes
    if: needs.changes.outputs.kind == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Find the main build of this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          need="windows-x64 macos linux-x64 linux-arm64"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$SHA&status=success&per_page=50" \
                 --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .id')
          for id in $runs; do
            have=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
            ok=true
            for a in $need; do grep -qx "$a" <<< "$have" || ok=false; done
            if $ok; then echo "run=$id" >> "$GITHUB_OUTPUT"; echo "Using run $id"; exit 0; fi
          done
          echo "::error::No successful main build with all the release files for $TAG ($SHA). Releases are not rebuilt. Wait for the main build of this commit to finish (or, if that push only changed docs and skipped the builds, run CI by hand on main: Actions, CI, Run workflow), then re-run this job."
          exit 1
      - name: Download its files
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.find.outputs.run }}
        run: gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n windows-x64 -n macos -n linux-x64 -n linux-arm64 -D files
      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          mkdir upload
          find files -type f -exec mv {} upload/ \;
          cd upload
          ls -l
          for s in *.sha256; do sha256sum -c "$s"; done
          for f in "ENCORE-Basement-Studio-$VERSION-windows-setup.exe" "ENCORE-Basement-Studio-$VERSION-windows-x64.zip" \
                   "ENCORE-Basement-Studio-$VERSION-macos.dmg" \
                   "encore-basement-studio_${VERSION}_amd64.deb" "encore-basement-studio_${VERSION}_arm64.deb" \
                   "ENCORE-Basement-Studio-$VERSION-x86_64.AppImage" "ENCORE-Basement-Studio-$VERSION-aarch64.AppImage"; do
            test -f "$f" && test -f "$f.sha256" || { echo "::error::$f or its .sha256 is missing"; exit 1; }
          done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./* --verify-tag --title "ENCORE. Basement Studio $TAG" \
              --notes "Windows installer and zip, macOS disk image (Apple Silicon and Intel), and Linux x64 and arm64 packages (.deb and AppImage). A SHA-256 file is next to each download." \
              --repo "$GITHUB_REPOSITORY"
          fi
