name: CI

# One run per push: pull requests run on pull_request; main and v* tags run on push.
#
#   pull request          in parallel: Linux x64, Windows x64 (with the 32-bit plugin
#                         bridge) and macOS on Apple Silicon: the app and its
#                         self-test. No installers or packages
#   push to main, manual  the release files, in parallel: Windows x64 (installer and
#                         zip), macOS (dmg, Apple Silicon and Intel), Linux x64 and
#                         arm64 (.deb and AppImage), each with its self-test, plus the
#                         Linux packages installed and tested on Debian 12 and
#                         Ubuntu 22.04 and 24.04. Uploaded as workflow artifacts
#   weekly (Monday), or   the pull request checks, plus the app built with
#   manual with checks:   AddressSanitizer and UndefinedBehaviorSanitizer on Linux
#   weekly                x64, running its self-test
#   v* tag                no rebuild: the files from the successful main build of
#                         the tag's commit are attached to the GitHub Release
#
# Docs-only changes skip the builds (see the changes job).
#
# Every action is pinned to a commit (the version is in the comment next to it);
# Dependabot proposes updates (.github/dependabot.yml).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '29 6 * * 1'
  workflow_dispatch:
    inputs:
      checks:
        description: 'build: the release files, as on main. weekly: the sanitizer self-test too'
        type: choice
        options: [build, weekly]
        default: build

permissions:
  contents: read

# A newer push to the same pull request cancels the older run. Runs on main are
# never cancelled: every main commit keeps its build, so it can be released.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Debian 12 packages JUCE and Tracktion Engine need on Linux (no curl, web
  # browser or OpenGL: the app leaves those out), a virtual display for the
  # self-test, ccache, and the packaging tools
  LINUX_DEPS: >-
    build-essential g++ cmake ninja-build pkg-config ccache curl file
    libasound2-dev libjack-jackd2-dev ladspa-sdk
    libfreetype-dev libfontconfig1-dev
    libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev
    xvfb xauth
    dpkg-dev librsvg2-bin
  SCCACHE_VERSION: v0.10.0
  SCCACHE_SHA256: 6d8823b5c13e0dba776d88c537229256ecb2f01a1d775b507fd141cb55d30578

jobs:
  # Decides what runs. A pull request or push that only touches docs (*.md,
  # LICENSE, .github/CODEOWNERS) skips the builds; skipped jobs count as passing,
  # so docs-only pull requests stay mergeable when checks are required. Tags,
  # manual and weekly runs always run what they need.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      kind: ${{ steps.diff.outputs.kind }}
      linux: ${{ steps.diff.outputs.linux }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          CHECKS: ${{ inputs.checks }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # kind: pr (the app and its self-test on each system), build (all the
          # release files), weekly (pr, plus the sanitizers), release (no build)
          if [[ "$REF" == refs/tags/v* ]]; then
            kind=release
          elif [[ "$EVENT" == "pull_request" ]]; then
            kind=pr
          elif [[ "$EVENT" == "schedule" || "$CHECKS" == "weekly" ]]; then
            kind=weekly
          else
            kind=build
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [[ "$kind" == build ]]; then
            echo 'linux=[{"arch":"x64"},{"arch":"arm64"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'linux=[{"arch":"x64"}]' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$EVENT" == "pull_request" ]]; then
            files=$(git diff --name-only "$PR_BASE" "$PR_HEAD")
          elif [[ "$EVENT" == "push" && "$REF" == refs/heads/* && -n "$PUSH_BEFORE" && "$PUSH_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            files=$(git diff --name-only "$PUSH_BEFORE" "$SHA")
          else
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "Tag, manual or weekly run: everything it needs runs"; exit 0
          fi
          echo "Changed files:"; echo "$files"
          code=$(echo "$files" | grep -Ev '(\.md$|^LICENSE$|^\.github/CODEOWNERS$)' | grep -c . || true)
          if [[ "$code" -gt 0 ]]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; echo "Docs only: builds and tests are skipped"; fi
      - id: version
        name: Version (from CMakeLists.txt; a tag must match it)
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(EncoreBasementStudio VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)
          [[ -n "$version" ]] || { echo "::error::No project(EncoreBasementStudio VERSION x.y.z) in CMakeLists.txt"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"
          if [[ "$REF" == refs/tags/v* && "v$version" != "$REF_NAME" ]]; then
            echo "::error::Tag $REF_NAME does not match the version in CMakeLists.txt ($version). Change project(EncoreBasementStudio VERSION ...) on main first."
            exit 1
          fi

      # Every version has its release notes in CHANGELOG.md, so the "Release
      # vX.Y.Z" pull request can't merge without them. The release job puts
      # them on the GitHub release.
      - name: Release notes for this version (CHANGELOG.md)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/release-notes.sh "$VERSION"

  # Built inside Debian 12 (bookworm, glibc 2.36) so the packages also run on
  # Bookworm-based Raspberry Pi OS and other older systems. arm64 runs on GitHub's
  # native arm64 runner, never under emulation.
  linux:
    # A fixed name: GitHub adds the matrix value to it ("Linux (x64)"), and a skipped
    # run shows plain "Linux" instead of an unfilled ${{ }} template.
    name: Linux
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.kind != 'release'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.linux) }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: debian:bookworm
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 2G
    steps:
      # git first, so checkout makes a real clone (the Tracktion patch is applied with git)
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates $LINUX_DEPS
          git config --global --add safe.directory '*'
      # Submodules: depth 1 and not recursive (submodules: true, not 'recursive'):
      # encore-vst and Tracktion Engine. The next step fetches the audio
      # processing and JUCE through encore-vst.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      # The audio processing and JUCE come through encore-vst (the one pin that
      # decides the plugins, the audio processing and JUCE): those two
      # folders, one level at a time, not recursive
      - name: Audio processing and JUCE (through encore-vst)
        shell: bash
        run: |
          git -C external/encore-vst submodule update --init --depth 1 external/encore-audio-processing
          git -C external/encore-vst/external/encore-audio-processing submodule update --init --depth 1 external/JUCE
      - name: Cache key
        id: key
        run: |
          echo "pins=$(git -C external/encore-vst/external/encore-audio-processing rev-parse HEAD:external/JUCE | cut -c1-12)-$(git rev-parse HEAD:external/tracktion_engine | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "compiler=gcc-$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
      # Keyed on OS and architecture, compiler and the JUCE and Tracktion pins; each
      # run saves a new one and the next run starts from the newest
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-debian12-${{ matrix.arch }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
          restore-keys: ccache-debian12-${{ matrix.arch }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          ccache -z
          cmake --build build --parallel "$(nproc)"
          ccache -s
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.key.outputs.pins != ''
        with:
          path: .ccache
          key: ccache-debian12-${{ matrix.arch }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
      # Makes songs, imports, mixes, exports, reopens and runs each built-in
      # ENCORE. plugin, without an audio device (needs an X display)
      - name: Self-test
        run: |
          exe="build/EncoreBasementStudio_artefacts/Release/ENCORE Basement Studio"
          dir="$RUNNER_TEMP/selftest"
          code=0
          timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" "$exe" --selftest "$dir" || code=$?
          cat "$dir/selftest.log" || true
          if [ $code -eq 124 ]; then echo "::error::the self-test timed out"; fi
          if [ $code -ne 0 ]; then echo "::error::the self-test failed ($code)"; fi
          exit $code
      # Other makers' plugins, the way the Effects button loads them: the ENCORE. VST
      # release the pin points to, as LV2 and VST3, each put on a track and its
      # editor opened (--plugintest). Proves LV2 hosting with real plugins.
      - name: Plugin hosting (ENCORE. VST's LV2 and VST3)
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          tgz=$(.github/encore-vst-release.sh "linux-$ARCH.tar.gz" "$RUNNER_TEMP/vst")
          tar -xzf "$tgz" -C "$RUNNER_TEMP/vst"
          folder=$(find "$RUNNER_TEMP/vst" -mindepth 1 -maxdepth 1 -type d -name 'ENCORE-VST-*' | head -n 1)
          exe="build/EncoreBasementStudio_artefacts/Release/ENCORE Basement Studio"
          report="$RUNNER_TEMP/plugintest.txt"
          code=0
          timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" "$exe" --plugintest "$report" "$folder" || code=$?
          cat "$report" || true
          for format in LV2 VST3; do
            grep -q "^$format in " "$report" || { echo "::error::$format plugins were not searched"; code=1; }
          done
          pass=$(grep -c '^PASS ' "$report" || true)
          [ "$pass" -eq 10 ] || { echo "::error::expected the 5 ENCORE. plugins as LV2 and as VST3 (10) to load and open, $pass did"; code=1; }
          exit $code
      # Monitoring, meters and recording against a pretend four-input interface
      # (about a minute, so not on pull requests)
      - name: Audio test
        if: needs.changes.outputs.kind == 'build'
        run: |
          exe="build/EncoreBasementStudio_artefacts/Release/ENCORE Basement Studio"
          dir="$RUNNER_TEMP/audiotest"
          code=0
          timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" "$exe" --audiotest "$dir" || code=$?
          cat "$dir/audiotest.log" || true
          if [ $code -eq 124 ]; then echo "::error::the audio test timed out"; fi
          if [ $code -ne 0 ]; then echo "::error::the audio test failed ($code)"; fi
          exit $code
      # The .deb (Debian, Ubuntu, Mint, Raspberry Pi OS) and the AppImage (most other distributions)
      - name: Linux packages
        if: needs.changes.outputs.kind == 'build'
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          bash installer/linux/package.sh "build/EncoreBasementStudio_artefacts/Release/ENCORE Basement Studio" dist all
          cd dist
          for f in *.deb *.AppImage; do sha256sum "$f" > "$f.sha256"; done
          ls -l
          cat *.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.kind == 'build'
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
            dist/*.AppImage
            dist/*.AppImage.sha256
          if-no-files-found: error

  # The packages on the oldest and newest systems they're for: a bare Debian 12
  # (Bookworm, the base of Raspberry Pi OS Bookworm), Debian 13 (Trixie, the base
  # of Raspberry Pi OS Trixie and ENCORE. OS), Ubuntu 22.04 and Ubuntu 24.04.
  # Each installs the .deb the way a user would, checks what it put in place, then
  # self-tests the installed app and the AppImage. No build here.
  linux-packages:
    # A fixed name: GitHub adds the matrix values to it ("Linux package tests
    # (arm64, debian-12)"), and a skipped run (pull requests, docs-only changes)
    # shows this name instead of a placeholder. The matrix only carries what the
    # name should show; the runner and container image come from it.
    name: Linux package tests
    needs: [changes, linux]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.kind == 'build'
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        system: [debian-12, debian-13, ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ format('{0}{1}', matrix.system == 'ubuntu-22.04' && 'ubuntu-22.04' || 'ubuntu-24.04', matrix.arch == 'arm64' && '-arm' || '') }}
    container: ${{ matrix.system == 'debian-12' && 'debian:bookworm' || matrix.system == 'debian-13' && 'debian:trixie' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-${{ matrix.arch }}
      - name: Check the SHA-256 files
        run: for s in *.sha256; do sha256sum -c "$s"; done
      - name: Test the .deb
        run: |
          SUDO=sudo; [ "$(id -u)" = 0 ] && SUDO=
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends xvfb xauth desktop-file-utils shared-mime-info
          deb=$(ls *.deb)
          $SUDO apt-get install -y --no-install-recommends "./$deb" \
            || { echo "::error::apt could not install $deb"; exit 1; }
          dpkg -L encore-basement-studio
          command -v encore-basement-studio || { echo "::error::encore-basement-studio is not on the PATH"; exit 1; }
          desktop-file-validate /usr/share/applications/encore-basement-studio.desktop || { echo "::error::the .desktop entry does not validate"; exit 1; }
          grep -q "x-encore-song" /usr/share/mime/globs2 || { echo "::error::application/x-encore-song is not registered"; exit 1; }
          grep -q "x-encore-song" /usr/share/applications/mimeinfo.cache || { echo "::error::.encore songs are not linked to the app"; exit 1; }
          dir="$RUNNER_TEMP/selftest-deb"
          code=0
          timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" encore-basement-studio --selftest "$dir" || code=$?
          cat "$dir/selftest.log" || true
          if [ $code -eq 124 ]; then echo "::error::the installed app's self-test timed out"; fi
          if [ $code -ne 0 ]; then echo "::error::the installed app's self-test failed ($code)"; fi
          exit $code
      # Runners have no FUSE, so the AppImage unpacks itself to run (its system libraries came with the .deb above)
      - name: Test the AppImage
        run: |
          img=$(ls *.AppImage)
          chmod +x "$img"
          dir="$RUNNER_TEMP/selftest-appimage"
          code=0
          timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" "./$img" --appimage-extract-and-run --selftest "$dir" || code=$?
          cat "$dir/selftest.log" || true
          if [ $code -eq 124 ]; then echo "::error::the AppImage self-test timed out"; fi
          if [ $code -ne 0 ]; then echo "::error::the AppImage self-test failed ($code)"; fi
          exit $code

  windows:
    name: Windows x64
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.kind != 'release'
    runs-on: windows-2022
    env:
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
      SCCACHE_CACHE_SIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      # The audio processing and JUCE come through encore-vst (the one pin that
      # decides the plugins, the audio processing and JUCE): those two
      # folders, one level at a time, not recursive
      - name: Audio processing and JUCE (through encore-vst)
        shell: bash
        run: |
          git -C external/encore-vst submodule update --init --depth 1 external/encore-audio-processing
          git -C external/encore-vst/external/encore-audio-processing submodule update --init --depth 1 external/JUCE
      - name: Install sccache ${{ env.SCCACHE_VERSION }}
        shell: pwsh
        run: |
          $name = "sccache-$env:SCCACHE_VERSION-x86_64-pc-windows-msvc"
          Invoke-WebRequest "https://github.com/mozilla/sccache/releases/download/$env:SCCACHE_VERSION/$name.zip" -OutFile "$env:RUNNER_TEMP\sccache.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP\sccache.zip" -Algorithm SHA256).Hash -ne $env:SCCACHE_SHA256) { throw "sccache download does not match its SHA-256" }
          Expand-Archive "$env:RUNNER_TEMP\sccache.zip" -DestinationPath "$env:RUNNER_TEMP"
          "$env:RUNNER_TEMP\$name" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: MSVC environment, x64 (for Ninja)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Cache key
        id: key
        shell: bash
        run: |
          echo "pins=$(git -C external/encore-vst/external/encore-audio-processing rev-parse HEAD:external/JUCE | cut -c1-12)-$(git rev-parse HEAD:external/tracktion_engine | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "compiler=msvc-$VCToolsVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sccache
          key: sccache-${{ runner.os }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
          restore-keys: sccache-${{ runner.os }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-
      # Embedded debug info (/Z7) so sccache can cache every object
      - name: Configure
        shell: pwsh
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      - name: Build
        shell: pwsh
        run: |
          sccache --zero-stats
          cmake --build build --parallel
      # The 32-bit plugin bridge: its own 32-bit build, beside ENCORE Basement Studio.exe
      - name: MSVC environment, x86 (for the 32-bit bridge)
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x86
      - name: Build the 32-bit plugin bridge
        shell: pwsh
        run: |
          cmake -B build32 -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTUDIO_BRIDGE_ONLY=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          cmake --build build32 --parallel
          Copy-Item "build32/EncoreBasementStudioBridge32_artefacts/Release/ENCORE Basement Studio Bridge32.exe" "build/EncoreBasementStudio_artefacts/Release/"
          sccache --show-stats
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.key.outputs.pins != ''
        with:
          path: .sccache
          key: sccache-${{ runner.os }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
      - name: Self-test
        shell: pwsh
        run: |
          $exe = "build/EncoreBasementStudio_artefacts/Release/ENCORE Basement Studio.exe"
          $dir = Join-Path $env:RUNNER_TEMP "selftest"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "`"$dir`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "self-test timed out" }
          Get-Content (Join-Path $dir "selftest.log")
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
      # ENCORE. VST's installer, offered in Basement Studio's installer as an extra:
      # the ENCORE. VST release external/encore-vst is pinned to, so the bundled
      # installer always matches the plugins built in, and the same commit
      # always makes the same installer. On main it must exist.
      - name: Fetch the ENCORE. VST installer (the pinned release)
        if: needs.changes.outputs.kind == 'build'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          setup=$(.github/encore-vst-release.sh windows-setup.exe build/vst)
          mv "$setup" build/vst/ENCORE-VST-setup.exe
      # Inno Setup: Start menu and desktop shortcuts, opens .encore songs, uninstaller.
      # The version comes from build/version.iss (written by CMake from CMakeLists.txt).
      - name: Installer
        if: needs.changes.outputs.kind == 'build'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /Q installer/EncoreBasementStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "installer failed" }
      - name: Zip and SHA-256
        if: needs.changes.outputs.kind == 'build'
        shell: bash
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          setup="ENCORE-Basement-Studio-$VERSION-windows-setup.exe"
          zip="ENCORE-Basement-Studio-$VERSION-windows-x64.zip"
          test -f "dist/$setup" || { echo "::error::dist/$setup is missing (does the installer's version match CMakeLists.txt?)"; ls dist; exit 1; }
          mkdir zip
          cp "build/EncoreBasementStudio_artefacts/Release/ENCORE Basement Studio.exe" "build/EncoreBasementStudio_artefacts/Release/ENCORE Basement Studio Bridge32.exe" zip/
          cp LICENSE THIRD-PARTY-NOTICES.md TRADEMARKS.md README.md zip/
          (cd zip && 7z a -tzip "../dist/$zip" . > /dev/null)
          cd dist
          sha256sum "$setup" > "$setup.sha256"
          sha256sum "$zip" > "$zip.sha256"
          ls -l
          cat *.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.kind == 'build'
        with:
          name: windows-x64
          path: |
            dist/ENCORE-Basement-Studio-*-windows-setup.exe
            dist/ENCORE-Basement-Studio-*-windows-setup.exe.sha256
            dist/ENCORE-Basement-Studio-*-windows-x64.zip
            dist/ENCORE-Basement-Studio-*-windows-x64.zip.sha256
          if-no-files-found: error

  macos:
    name: macOS
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.kind != 'release'
    runs-on: macos-15
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      # The audio processing and JUCE come through encore-vst (the one pin that
      # decides the plugins, the audio processing and JUCE): those two
      # folders, one level at a time, not recursive
      - name: Audio processing and JUCE (through encore-vst)
        shell: bash
        run: |
          git -C external/encore-vst submodule update --init --depth 1 external/encore-audio-processing
          git -C external/encore-vst/external/encore-audio-processing submodule update --init --depth 1 external/JUCE
      - name: Install Ninja and ccache
        run: brew install ninja ccache
      - name: Cache key
        id: key
        run: |
          echo "pins=$(git -C external/encore-vst/external/encore-audio-processing rev-parse HEAD:external/JUCE | cut -c1-12)-$(git rev-parse HEAD:external/tracktion_engine | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "compiler=xcode-$(xcodebuild -version | head -n 1 | tr -cd '0-9.')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-
      # Release files: one app for Apple Silicon and Intel Macs. Checks build for
      # Apple Silicon only: half the compiling, and Intel-only bugs are rare.
      - name: Configure
        env:
          ARCHS: ${{ needs.changes.outputs.kind == 'build' && 'arm64;x86_64' || 'arm64' }}
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_OSX_ARCHITECTURES=$ARCHS"
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: |
          ccache -z
          cmake --build build --parallel "$(sysctl -n hw.ncpu)"
          ccache -s
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.key.outputs.pins != ''
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
      # Signed ad hoc as a whole (both halves of the universal app and its resources),
      # as ENCORE. VST's plugins are: not with a Developer ID, so Gatekeeper still asks
      # once (Privacy & Security, Open Anyway)
      - name: Sign the app (ad hoc)
        run: |
          set -euo pipefail
          app="build/EncoreBasementStudio_artefacts/Release/ENCORE Basement Studio.app"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for arch in $(lipo -archs "$app/Contents/MacOS/ENCORE Basement Studio"); do
            codesign --display --arch "$arch" "$app" 2>&1 | grep -q "Signature=adhoc" \
              || { echo "::error::the $arch half of the app is not signed"; exit 1; }
            echo "$arch: signed (ad hoc)"
          done
          /usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes:0:CFBundleTypeExtensions" "$app/Contents/Info.plist" | tee /dev/stderr | grep -q encore \
            || { echo "::error::the app doesn't say it opens .encore songs"; exit 1; }
      - name: Self-test
        run: |
          app="build/EncoreBasementStudio_artefacts/Release/ENCORE Basement Studio.app"
          lipo -info "$app/Contents/MacOS/ENCORE Basement Studio"
          dir="$RUNNER_TEMP/selftest"
          "$app/Contents/MacOS/ENCORE Basement Studio" --selftest "$dir" &
          pid=$!
          for i in $(seq 1 300); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; echo "::error::the self-test timed out"; exit 1; fi
          code=0; wait $pid || code=$?
          cat "$dir/selftest.log"
          exit $code
      # The Mac download: a disk image to drag the app into Applications, with
      # ENCORE. VST's installer beside it
      - name: Disk image and SHA-256
        if: needs.changes.outputs.kind == 'build'
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          dmg="ENCORE-Basement-Studio-$VERSION-macos.dmg"
          mkdir -p dmg dist
          cp -R "build/EncoreBasementStudio_artefacts/Release/ENCORE Basement Studio.app" dmg/
          ln -s /Applications dmg/Applications
          # ENCORE. VST's Mac installer (the release the pin points to), for the same
          # plugins in Logic, GarageBand and other music apps
          .github/encore-vst-release.sh macos.pkg dmg
          rm dmg/*.sha256
          cp LICENSE dmg/LICENSE.txt
          cp THIRD-PARTY-NOTICES.md TRADEMARKS.md dmg/
          hdiutil create -volname "ENCORE. Basement Studio" -srcfolder dmg -ov -format UDZO "dist/$dmg"
          cd dist
          shasum -a 256 "$dmg" > "$dmg.sha256"
          ls -l
          cat *.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.changes.outputs.kind == 'build'
        with:
          name: macos
          path: |
            dist/ENCORE-Basement-Studio-*-macos.dmg
            dist/ENCORE-Basement-Studio-*-macos.dmg.sha256
          if-no-files-found: error

  # Weekly: the app built with AddressSanitizer and UndefinedBehaviorSanitizer,
  # running its self-test. They catch memory errors and undefined behaviour
  # (the kind of bug that crashes a session) that the plain self-test misses.
  # Two to three times slower, so weekly.
  #
  # Undefined behaviour is reported and the self-test carries on, so one run
  # lists every finding; the job then fails if there were any. A memory error
  # stops the run at once (after one, memory may be corrupt and later results
  # can't be trusted). Exceptions: .github/sanitizers/ubsan.supp, each with its reason.
  sanitizers:
    name: Sanitizers (Linux x64)
    needs: changes
    if: needs.changes.outputs.kind == 'weekly'
    runs-on: ubuntu-24.04
    container: debian:bookworm
    defaults:
      run:
        shell: bash
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 2G
      # Leak checking is off: fontconfig, X11 and ALSA keep memory until exit by design
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
    steps:
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates $LINUX_DEPS
          git config --global --add safe.directory '*'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false
      # The audio processing and JUCE come through encore-vst (the one pin that
      # decides the plugins, the audio processing and JUCE): those two
      # folders, one level at a time, not recursive
      - name: Audio processing and JUCE (through encore-vst)
        shell: bash
        run: |
          git -C external/encore-vst submodule update --init --depth 1 external/encore-audio-processing
          git -C external/encore-vst/external/encore-audio-processing submodule update --init --depth 1 external/JUCE
      - name: Cache key
        id: key
        run: |
          echo "pins=$(git -C external/encore-vst/external/encore-audio-processing rev-parse HEAD:external/JUCE | cut -c1-12)-$(git rev-parse HEAD:external/tracktion_engine | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "compiler=gcc-$(gcc -dumpfullversion)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-sanitizers-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
          restore-keys: ccache-sanitizers-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-
      - name: Configure
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
          "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined"
          "-DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: |
          ccache -z
          cmake --build build --parallel "$(nproc)"
          ccache -s
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.key.outputs.pins != ''
        with:
          path: .ccache
          key: ccache-sanitizers-${{ steps.key.outputs.compiler }}-${{ steps.key.outputs.pins }}-${{ github.run_id }}
      - name: Self-test
        run: |
          exe="build/EncoreBasementStudio_artefacts/RelWithDebInfo/ENCORE Basement Studio"
          dir="$RUNNER_TEMP/selftest"
          reports="$RUNNER_TEMP/ubsan"
          mkdir -p "$reports"
          export UBSAN_OPTIONS="print_stacktrace=1:halt_on_error=0:report_error_type=1:suppressions=$GITHUB_WORKSPACE/.github/sanitizers/ubsan.supp:log_path=$reports/report"
          code=0
          timeout 900 xvfb-run -a -s "-screen 0 1920x1080x24" "$exe" --selftest "$dir" || code=$?
          cat "$dir/selftest.log" || true
          bash .github/sanitizers/report.sh "$reports" "$code"

  # Every pin is a published release (or a listed exception): the README's
  # Pinned releases table against what each folder is pinned to, including what
  # encore-vst pins (the audio processing) and what that pins (JUCE). Runs on
  # every pull request and push, docs-only ones too: it reads the README.
  pins:
    name: Pinned releases
    needs: changes
    if: needs.changes.outputs.kind != 'release'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: The pinned folders whose own pins are listed
        run: |
          git submodule update --init --depth 1 external/encore-vst
          git -C external/encore-vst submodule update --init --depth 1 external/encore-audio-processing
      - name: Check the pins
        run: bash .github/pins/check.sh

  # The one check to require on main. It fails if any build or test job failed or
  # was cancelled, and passes when they passed or were skipped (docs-only changes).
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, pins, linux, linux-packages, windows, macos, sanitizers]
    runs-on: ubuntu-24.04
    steps:
      - name: Check the build and test jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" == failure || "$r" == cancelled ]]; then echo "::error::A build or test job did not pass"; exit 1; fi
          done

  # A person publishes a Release in GitHub, which creates the v* tag. Nothing is
  # rebuilt: the files come from the successful main build of the same commit.
  release:
    name: Release (files from the main build)
    needs: changes
    if: needs.changes.outputs.kind == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Find the main build of this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          need="windows-x64 macos linux-x64 linux-arm64"
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&head_sha=$SHA&status=success&per_page=50" \
                 --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .id')
          for id in $runs; do
            have=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
            ok=true
            for a in $need; do grep -qx "$a" <<< "$have" || ok=false; done
            if $ok; then echo "run=$id" >> "$GITHUB_OUTPUT"; echo "Using run $id"; exit 0; fi
          done
          echo "::error::No successful main build with all the release files for $TAG ($SHA). Releases are not rebuilt. Wait for the main build of this commit to finish (or, if that push only changed docs and skipped the builds, run CI by hand on main: Actions, CI, Run workflow), then re-run this job."
          exit 1
      - name: Download its files
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.find.outputs.run }}
        run: gh run download "$RUN" --repo "$GITHUB_REPOSITORY" -n windows-x64 -n macos -n linux-x64 -n linux-arm64 -D files
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          sparse-checkout: |
            CHANGELOG.md
            .github/release-notes.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Attach them to the release, with its title and notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          set -euo pipefail
          # Title and notes come from the repository (CHANGELOG.md), whatever
          # was typed when the release was published.
          title="ENCORE. Basement Studio $TAG"
          (cd src && .github/release-notes.sh "$VERSION") > notes.md
          mkdir upload
          find files -type f -exec mv {} upload/ \;
          cd upload
          ls -l
          for s in *.sha256; do sha256sum -c "$s"; done
          for f in "ENCORE-Basement-Studio-$VERSION-windows-setup.exe" "ENCORE-Basement-Studio-$VERSION-windows-x64.zip" \
                   "ENCORE-Basement-Studio-$VERSION-macos.dmg" \
                   "encore-basement-studio_${VERSION}_amd64.deb" "encore-basement-studio_${VERSION}_arm64.deb" \
                   "ENCORE-Basement-Studio-$VERSION-x86_64.AppImage" "ENCORE-Basement-Studio-$VERSION-aarch64.AppImage"; do
            test -f "$f" && test -f "$f.sha256" || { echo "::error::$f or its .sha256 is missing"; exit 1; }
          done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "$title" --notes-file ../notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./* --verify-tag --title "$title" \
              --notes-file ../notes.md --repo "$GITHUB_REPOSITORY"
          fi
