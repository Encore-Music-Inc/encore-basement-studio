name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Only the two top-level submodules (Tracktion's own nested JUCE uses an SSH address)
      - name: Fetch JUCE and Tracktion Engine
        run: git submodule update --init --depth 1 external/JUCE external/tracktion_engine

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      # The 32-bit plugin bridge: its own 32-bit build, then beside Encore Studio.exe
      - name: Build the 32-bit plugin bridge
        shell: pwsh
        run: |
          cmake -B build32 -A Win32 -DSTUDIO_BRIDGE_ONLY=ON
          cmake --build build32 --config Release --parallel
          Copy-Item "build32/EncoreStudioBridge32_artefacts/Release/Encore Studio Bridge32.exe" "build/EncoreStudio_artefacts/Release/"

      - name: Self-test
        shell: pwsh
        run: |
          $exe = "build/EncoreStudio_artefacts/Release/Encore Studio.exe"
          $dir = Join-Path $env:RUNNER_TEMP "selftest"
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest", "`"$dir`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "self-test timed out" }
          Get-Content (Join-Path $dir "selftest.log")
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "build/EncoreStudio_artefacts/Release/Encore Studio.exe", "build/EncoreStudio_artefacts/Release/Encore Studio Bridge32.exe", LICENSE, README.md dist/
          Compress-Archive dist/* Encore-Studio-windows.zip

      # ENCORE. VST's installer, offered in Basement's installer as an extra (skipped if it can't be fetched)
      - name: Fetch the ENCORE. VST installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try {
            $tag = gh api repos/jimmyrlondo/encore-vst/releases --jq '[.[] | select(.draft | not) | select(.assets | length > 0)][0].tag_name'
            gh release download $tag --repo jimmyrlondo/encore-vst --pattern "*windows-setup.exe" --dir build/vst
            Get-ChildItem build/vst/*.exe | Select-Object -First 1 | Rename-Item -NewName "ENCORE-VST-setup.exe"
            Get-ChildItem build/vst
          } catch { Write-Warning "No ENCORE. VST installer: the option is left out ($_)" }

      # The installer (Inno Setup): Start menu + desktop shortcuts, opens .encore songs, uninstaller
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(EncoreStudio VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$version" installer/EncoreStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "installer failed" }
          Get-ChildItem dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Encore-Studio-windows
          path: |
            Encore-Studio-windows.zip
            dist/Encore-Studio-*-windows-setup.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Encore-Studio-windows.zip
            dist/Encore-Studio-*-windows-setup.exe
          prerelease: true
          generate_release_notes: true

  # Linux on x64 and on arm64 (the arm64 runner stands in for 64-bit Raspberry Pi OS).
  # Built inside Debian 12 (bookworm, glibc 2.36) so the packages also run on Bookworm-based
  # Raspberry Pi OS and other older systems, not just on the newest ones.
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:bookworm
    defaults:
      run:
        shell: bash
    steps:
      # git first, so checkout makes a real clone (the submodules need it)
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Fetch JUCE and Tracktion Engine
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 external/JUCE external/tracktion_engine

      # JUCE and Tracktion's Linux libraries (no curl, web browser or OpenGL: Studio leaves those out),
      # a virtual display for the self-test, and the packaging tools
      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            build-essential g++ cmake ninja-build pkg-config curl zip file \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            xvfb xauth \
            dpkg-dev librsvg2-bin
          echo "::notice title=build system ${{ matrix.arch }}::$(. /etc/os-release; echo $PRETTY_NAME), $(ldd --version | head -n 1), $(g++ --version | head -n 1), $(cmake --version | head -n 1)"

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel 4

      - name: Self-test
        run: |
          exe="build/EncoreStudio_artefacts/Release/Encore Studio"
          dir="$RUNNER_TEMP/selftest"
          code=0
          timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" "$exe" --selftest "$dir" || code=$?
          cat "$dir/selftest.log" || true
          if [ $code -eq 124 ]; then echo "self-test timed out"; fi
          exit $code

      - name: Package
        run: |
          mkdir dist
          cp "build/EncoreStudio_artefacts/Release/Encore Studio" LICENSE README.md dist/
          cd dist && zip -r ../Encore-Studio-linux-${{ matrix.arch }}.zip .

      # The .deb (Debian, Ubuntu, Mint, Raspberry Pi OS) and the AppImage (most other distributions)
      - name: Linux packages
        run: bash installer/linux/package.sh "build/EncoreStudio_artefacts/Release/Encore Studio" dist-linux all

      - name: Package sizes
        run: ls -l Encore-Studio-linux-*.zip dist-linux/

      - uses: actions/upload-artifact@v4
        with:
          name: Encore-Studio-linux-${{ matrix.arch }}
          path: |
            Encore-Studio-linux-${{ matrix.arch }}.zip
            dist-linux/*.deb
            dist-linux/*.AppImage

  # The packages on the oldest and newest systems they're for: a bare Debian 12 (Bookworm, the
  # base of Raspberry Pi OS Bookworm), Ubuntu 22.04 and Ubuntu 24.04. Each one installs the .deb
  # the way a user would, checks what it put in place, then self-tests the installed app and the AppImage.
  linux-test:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, system: debian-12, runner: ubuntu-24.04, image: "debian:bookworm" }
          - { arch: x64, system: ubuntu-22.04, runner: ubuntu-22.04, image: "" }
          - { arch: x64, system: ubuntu-24.04, runner: ubuntu-24.04, image: "" }
          - { arch: arm64, system: debian-12, runner: ubuntu-24.04-arm, image: "debian:bookworm" }
          - { arch: arm64, system: ubuntu-22.04, runner: ubuntu-22.04-arm, image: "" }
          - { arch: arm64, system: ubuntu-24.04, runner: ubuntu-24.04-arm, image: "" }
    name: linux-test (${{ matrix.arch }}, ${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Encore-Studio-linux-${{ matrix.arch }}

      - name: Test the .deb
        run: |
          SUDO=sudo; [ "$(id -u)" = 0 ] && SUDO=
          export DEBIAN_FRONTEND=noninteractive
          $SUDO apt-get update
          $SUDO apt-get install -y --no-install-recommends xvfb xauth desktop-file-utils shared-mime-info
          deb=$(ls dist-linux/*.deb)
          $SUDO apt-get install -y --no-install-recommends "./$deb" \
            || { echo "::error title=${{ matrix.system }} ${{ matrix.arch }}::apt could not install $deb"; exit 1; }
          dpkg -L encore-basement-studio
          launcher=$(command -v encore-basement-studio) || { echo "::error::encore-basement-studio is not on the PATH"; exit 1; }
          echo "launcher: $launcher"
          desktop-file-validate /usr/share/applications/encore-basement-studio.desktop || { echo "::error::the .desktop entry does not validate"; exit 1; }
          grep -q "x-encore-song" /usr/share/mime/globs2 || { echo "::error::application/x-encore-song is not registered"; exit 1; }
          grep -E "x-encore-song" /usr/share/mime/globs2
          grep -q "x-encore-song" /usr/share/applications/mimeinfo.cache || { echo "::error::.encore songs are not linked to the app"; exit 1; }
          dir="$RUNNER_TEMP/selftest-deb"
          code=0
          timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" encore-basement-studio --selftest "$dir" || code=$?
          cat "$dir/selftest.log" || true
          echo "::notice title=deb self-test ${{ matrix.system }} ${{ matrix.arch }}::$(. /etc/os-release; echo $PRETTY_NAME), $(ldd --version | head -n 1): exit $code, $(grep -c '^PASS' "$dir/selftest.log" 2>/dev/null) checks passed, $(tail -n 1 "$dir/selftest.log" 2>/dev/null)"
          if [ $code -eq 124 ]; then echo "::error::the installed app's self-test timed out"; fi
          if [ $code -ne 0 ]; then echo "::error::the installed app's self-test failed ($code)"; fi
          exit $code

      # Runners have no FUSE, so the AppImage unpacks itself to run (its system libraries came with the .deb above)
      - name: Test the AppImage
        run: |
          img=$(ls dist-linux/*.AppImage)
          chmod +x "$img"
          dir="$RUNNER_TEMP/selftest-appimage"
          code=0
          timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" "./$img" --appimage-extract-and-run --selftest "$dir" || code=$?
          cat "$dir/selftest.log" || true
          echo "::notice title=AppImage self-test ${{ matrix.system }} ${{ matrix.arch }}::exit $code, $(grep -c '^PASS' "$dir/selftest.log" 2>/dev/null) checks passed, $(tail -n 1 "$dir/selftest.log" 2>/dev/null)"
          if [ $code -eq 124 ]; then echo "::error::the AppImage self-test timed out"; fi
          if [ $code -ne 0 ]; then echo "::error::the AppImage self-test failed ($code)"; fi
          exit $code

      # Tagged builds: attach the packages once they've passed on Debian 12 (one leg per arch uploads)
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.system == 'debian-12'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Encore-Studio-linux-${{ matrix.arch }}.zip
            dist-linux/*.deb
            dist-linux/*.AppImage
          prerelease: true

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE and Tracktion Engine
        run: git submodule update --init --depth 1 external/JUCE external/tracktion_engine

      # One app for Apple Silicon and Intel Macs
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Self-test
        run: |
          app="build/EncoreStudio_artefacts/Release/Encore Studio.app"
          dir="$RUNNER_TEMP/selftest"
          "$app/Contents/MacOS/Encore Studio" --selftest "$dir" &
          pid=$!
          for i in $(seq 1 300); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; echo "self-test timed out"; exit 1; fi
          wait $pid; code=$?
          cat "$dir/selftest.log"
          exit $code

      - name: Package
        run: |
          mkdir dist
          cp -R "build/EncoreStudio_artefacts/Release/Encore Studio.app" dist/
          cp LICENSE README.md dist/
          cd dist && ditto -c -k --sequesterRsrc . ../Encore-Studio-macos.zip

      # The Mac installer: a disk image to drag Encore Studio into Applications
      - name: Disk image
        run: |
          version=$(sed -nE 's/^project\(EncoreStudio VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt)
          mkdir dmg
          cp -R "build/EncoreStudio_artefacts/Release/Encore Studio.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Encore Studio" -srcfolder dmg -ov -format UDZO "Encore-Studio-$version-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Encore-Studio-macos
          path: |
            Encore-Studio-macos.zip
            Encore-Studio-*-macos.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Encore-Studio-macos.zip
            Encore-Studio-*-macos.dmg
          prerelease: true
